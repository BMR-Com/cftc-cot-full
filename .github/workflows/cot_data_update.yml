name: Weekly COT Data Update

on:
  schedule:
    # CFTC publishes Fri 3:30 PM ET (19:30 UTC summer / 20:30 UTC winter).
    # Run after release in both seasons, then retry for late/holiday-delayed reports.
    - cron: '50 20 * * 5'   # Fri 3:50 PM ET (winter) / 4:50 PM ET (summer)
    - cron: '30 23 * * 5'   # Fri evening retry
    - cron: '0 14 * * 6'    # Sat morning retry
    - cron: '0 14 * * 1'    # Mon retry (holiday weeks publish Monday)
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Force full rebuild from 2006 (delete existing CSV first)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: cot-data-update
  cancel-in-progress: false

jobs:
  update-cot-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy python-dateutil yfinance

      - name: Delete CSV for full rebuild (if requested)
        if: ${{ github.event.inputs.full_rebuild == 'true' }}
        run: |
          rm -f data/bcom_cot_master.csv
          echo "Full rebuild requested — existing CSV deleted."

      - name: Fetch weekly prices (Yahoo Finance)
        continue-on-error: true   # prices are optional; COT update must not fail because of Yahoo
        run: python scripts/prices.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Fetch index-trader (CIT) supplemental report
        continue-on-error: true   # 13 ag markets only; COT update must not fail because of it
        run: python scripts/fetch_cit_data.py
        env:
          PYTHONUNBUFFERED: '1'
          FULL_REBUILD: ${{ github.event.inputs.full_rebuild == 'true' && 'true' || 'false' }}

      - name: Run COT data fetcher
        run: |
          mkdir -p data
          python scripts/fetch_cot_data.py
        env:
          PYTHONUNBUFFERED: '1'
          # Manual runs skip the "is this week's report out yet?" check
          SKIP_FRESH_CHECK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Verify outputs exist
        run: |
          echo "=== Output files ==="
          ls -lh data/
          echo ""
          echo "CSV rows: $(wc -l < data/bcom_cot_master.csv)"
          echo "JSON size: $(wc -c < data/latest_summary.json) bytes"
          echo "Latest report date: $(python3 -c "import json; d=json.load(open('data/latest_summary.json')); print(d['report_date'])")"
          echo "Web data:"; ls -lh data/web data/web/series | head -40

      - name: Commit updated data to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/bcom_cot_master.csv data/latest_summary.json data/cotton_cot.csv data/web data/prices data/cit_master.csv
          if git diff --staged --quiet; then
            echo "No changes detected — CFTC may not have released new data yet."
          else
            REPORT_DATE=$(python3 -c "import json; d=json.load(open('data/latest_summary.json')); print(d['report_date'])")
            git commit -m "Auto: COT data update ${REPORT_DATE} [skip ci]"
            git push
            echo "Changes committed and pushed."
          fi

      - name: Upload CSV as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bcom-cot-data-${{ github.run_id }}
          path: |
            data/bcom_cot_master.csv
            data/latest_summary.json
            data/cit_master.csv
            data/web
          retention-days: 90
