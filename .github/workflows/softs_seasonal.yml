name: Softs seasonals (daily)

on:
  schedule:
    - cron: '40 22 * * 1-5'   # weekdays after the ICE softs close
  workflow_dispatch:

concurrency:
  group: softs-seasonal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        run: pip install -q pandas numpy requests websocket-client git+https://github.com/rongardF/tvdatafeed.git
      - name: Refresh live softs contracts (TradingView)
        continue-on-error: true      # keep yesterday's prices if TradingView is unavailable
        run: python scripts/softs_prices.py
      - name: Build seasonal data
        run: python scripts/softs_seasonal.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/softs data/web/softs_seasonal.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "softs seasonals: refresh $(date -u +%F) [bot]"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
